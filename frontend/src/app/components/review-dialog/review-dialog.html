<div class="review-dialog">
  <h2 class="dialog-title">
    Leave a review for &#64;{{ data.receiver.username }}
  </h2>

  <div class="form-group">
    <label class="form-label">Rating (Stars):</label>
    <select [(ngModel)]="rating" class="form-select">
      <option [ngValue]="5">★★★★★ 5/5</option>
      <option [ngValue]="4">★★★★ 4/5</option>
      <option [ngValue]="3">★★★ 3/5</option>
      <option [ngValue]="2">★★ 2/5</option>
      <option [ngValue]="1">★ 1/5</option>
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">Your Comment:</label>
    <textarea 
      [(ngModel)]="comment" 
      placeholder="How was your trip together? Would you travel with them again?" 
      class="form-textarea"
    ></textarea>
  </div>

  <div class="dialog-actions">
    <button (click)="onCancel()" class="btn btn-cancel">
      Cancel
    </button>
    <button (click)="onSubmit()" class="btn btn-submit">
      Submit Review
    </button>
  </div>
</div>
