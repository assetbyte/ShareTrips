<div class="success-card">
  
  <div class="icon-circle">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="check-icon">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
    </svg>
  </div>

  <h2 class="success-title">Payment Successful!</h2>
  
  <p class="success-description">
    Your seat is now officially secured. The driver and your teammates have been notified. Get ready for the road trip!
  </p>

  <div class="details-box">
    <div class="details-row">
      <span>Application ID:</span>
      <strong class="app-id">#{{ applicationId || 'N/A' }}</strong>
    </div>
    <div class="details-row">
      <span>Status:</span>
      <strong class="status-confirmed">Confirmed & Paid</strong>
    </div>
  </div>

  <button [routerLink]="['/my-team']" class="btn-primary">
    Back to My Teams
  </button>
</div>
