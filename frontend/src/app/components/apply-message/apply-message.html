<h2 mat-dialog-title class="dialog-title">
  Join the trip
</h2>

<mat-dialog-content class="dialog-content">
  <p class="dialog-description">
    Write a short note to the driver explaining why you want to join this trip:
  </p>
  
  <textarea 
    [(ngModel)]="message" 
    placeholder="e.g: I want to go with you because..." 
    rows="5"
    class="dialog-textarea"
  ></textarea>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button 
    type="button"
    (click)="onCancel()" 
    class="btn btn-cancel"
  >
    Cancel
  </button>
  
  <button 
    type="button"
    (click)="onSend()" 
    [disabled]="!message.trim()"
    class="btn btn-send"
  >
    Send Request
  </button>
</mat-dialog-actions>
